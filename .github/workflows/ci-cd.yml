name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./py-libp2p-src
          pip install pytest mypy trio requests base58 coincurve fastecdsa py-multibase py-multihash py-multicodec py-cid trio-typing rpcudp pycryptodome anyio aioquic noiseprotocol protobuf pynacl zeroconf trio-websocket morphys lru-dict

      - name: Verify Version Synchronization
        run: python3 bump-version.py --check

      - name: Run Mypy Type Checking
        run: mypy p2p-proxy-server/p2p_cache.py p2p-proxy-server/p2p_server.py p2p-proxy-server/p2p_libp2p.py p2p-proxy-server/dnf-p2p-client plugins/p2p_plugin.py bump-version.py

      - name: Run Pytest
        run: pytest tests/

  integration-test:
    name: Multi-Node Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Integration Tests
        run: |
          make dev-test

  build-rpm:
    name: Build & Verify Fedora RPMs (Fedora ${{ matrix.fedora-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora-version: ['44', '45']
    container:
      image: fedora:${{ matrix.fedora-version }}
    steps:
      - name: Install Build Tools and Dependencies
        run: |
          dnf install -y git-core make rpm-build tar curl findutils \
                         gcc gmp-devel python3-devel python3-pip \
                         python3-setuptools python3-wheel python3-hatchling \
                         cmake python3-sphinx systemd-rpm-macros \
                         dnf5 dnf5-plugins python3-libdnf5-python-plugins-loader

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          safe-directory: '*'

      - name: Build SRPM
        run: make srpm

      - name: Build Binary RPMs
        run: make rpm

      - name: Verify Binary RPM Installability
        run: dnf install -y build/rpmbuild/RPMS/*/*.rpm

      - name: Upload SRPM Artifact
        if: matrix.fedora-version == '44'
        uses: actions/upload-artifact@v4
        with:
          name: srpm
          path: build/rpmbuild/SRPMS/*.src.rpm

      - name: Upload Binary RPMs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpms-fedora-${{ matrix.fedora-version }}
          path: build/rpmbuild/RPMS/*/*.rpm

  release:
    name: Create GitHub Release
    needs: [test, integration-test, build-rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Version from Tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download SRPM Artifact
        uses: actions/download-artifact@v4
        with:
          name: srpm
          path: dist-srpm

      - name: Download Fedora 44 RPMs Artifact
        uses: actions/download-artifact@v4
        with:
          name: rpms-fedora-44
          path: dist-rpms/fedora-44

      - name: Download Fedora 45 RPMs Artifact
        uses: actions/download-artifact@v4
        with:
          name: rpms-fedora-45
          path: dist-rpms/fedora-45

      - name: Create Source Tarball
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          mkdir -p build/release/dnf-plugin-p2p-${VERSION}
          tar --exclude='.git' --exclude='.github' --exclude='build' --exclude='.copr' -cf - . | tar -x -C build/release/dnf-plugin-p2p-${VERSION}
          tar -czf dnf-plugin-p2p-${VERSION}.tar.gz -C build/release dnf-plugin-p2p-${VERSION}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dnf-plugin-p2p-${{ steps.get_version.outputs.VERSION }}.tar.gz
            dist-srpm/*.src.rpm
            dist-rpms/*/*/*.rpm
          draft: false
          prerelease: false
          generate_release_notes: true

  copr-release:
    name: Dispatch Fedora COPR Build
    needs: [build-rpm, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download SRPM Artifact
        uses: actions/download-artifact@v4
        with:
          name: srpm
          path: dist-srpm

      - name: Install copr-cli
        run: pip install copr-cli

      - name: Dispatch to Fedora COPR
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_URL: ${{ secrets.COPR_URL || 'https://copr.fedorainfracloud.org' }}
        run: |
          if [ -z "$COPR_LOGIN" ] || [ -z "$COPR_TOKEN" ]; then
            echo "COPR credentials not configured; skipping automated COPR build dispatch."
            exit 0
          fi
          mkdir -p ~/.config
          cat <<EOF > ~/.config/copr
          [copr-cli]
          login = ${COPR_LOGIN}
          username = staernid
          token = ${COPR_TOKEN}
          copr_url = ${COPR_URL}
          EOF
          srpm_file=$(ls dist-srpm/*.src.rpm | head -n 1)
          copr-cli build --nowait -r fedora-44-x86_64 -r fedora-45-x86_64 staernid/dnf-plugin-p2p "$srpm_file"
